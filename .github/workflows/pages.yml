name: Publicar no GitHub Pages

# Execução manual. Para usar, escolha GitHub Actions como fonte em Settings > Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Reunir apenas os arquivos do site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets .nojekyll _site/

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
